<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BroodNote Reset</title>
  <style>
    body{font-family:Arial,sans-serif;padding:20px;background:#fff7cc;color:#2b2216;}
    .card{max-width:680px;margin:0 auto;background:#fff;border:1px solid #e2d3aa;border-radius:12px;padding:16px;}
    button{font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid #c9b37a;background:#2F2418;color:#F5F1E8;cursor:pointer;}
    .muted{opacity:0.85}
    pre{white-space:pre-wrap;background:#f7f3e8;border:1px solid #e2d3aa;border-radius:10px;padding:10px;}
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset BroodNote offline cache</h2>
    <p class="muted">Use this page if BroodNote shows a blank screen. It will unregister any Service Worker and clear cached files for this site, then open BroodNote with the cache bypass flag.</p>
    <button id="run">Reset & Open BroodNote</button>
    <p id="status" class="muted"></p>
    <pre id="log"></pre>
  </div>

<script>
(async () => {
  const status = document.getElementById('status');
  const log = document.getElementById('log');
  const btn = document.getElementById('run');

  function write(msg){
    log.textContent += msg + "\n";
  }

  async function reset(){
    status.textContent = 'Working…';
    write('Starting reset…');

    // 1) Unregister all service workers (for this origin)
    if ('serviceWorker' in navigator) {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        write(`Found ${regs.length} service worker registration(s).`);
        for (const r of regs) {
          try {
            const ok = await r.unregister();
            write(`Unregister: ${ok ? 'OK' : 'FAILED'}`);
          } catch (e) {
            write('Unregister error: ' + (e && e.message ? e.message : String(e)));
          }
        }
      } catch (e) {
        write('SW getRegistrations error: ' + (e && e.message ? e.message : String(e)));
      }
    } else {
      write('ServiceWorker not supported here.');
    }

    // 2) Clear Cache Storage
    if ('caches' in window) {
      try {
        const keys = await caches.keys();
        write(`Found ${keys.length} cache(s).`);
        for (const k of keys) {
          try {
            const ok = await caches.delete(k);
            write(`Delete cache "${k}": ${ok ? 'OK' : 'FAILED'}`);
          } catch (e) {
            write(`Delete cache error (${k}): ` + (e && e.message ? e.message : String(e)));
          }
        }
      } catch (e) {
        write('caches.keys error: ' + (e && e.message ? e.message : String(e)));
      }
    } else {
      write('CacheStorage not supported here.');
    }

    // 3) Navigate with bypass flag
    status.textContent = 'Done. Opening BroodNote…';
    write('Redirecting to index.html?nosw=1');
    window.location.href = 'index.html?nosw=1';
  }

  btn.addEventListener('click', reset);
})();
</script>
</body>
</html>
