<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive Tracker</title>
 <style>
  body {
    font-family: Arial, sans-serif;
    padding: 1rem;
    background: #f8f8f8;
    font-size: 18px;
  }

  h1 {
    font-size: 1.6rem;
  }
<button id="scanNfc">Scan Hive (NFC)</button>
  input, textarea {
    width: 100%;
    margin-bottom: 1rem;
    padding: 0.75rem;
    font-size: 1.1rem;
  }

  textarea {
    min-height: 120px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-bottom: 0.25rem;
  }

  #rfid {
    font-size: 1.2rem;
    border: 3px solid #222;
  }

  .hidden {
    display: none;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.1rem;
  }

  input[type="checkbox"] {
    width: 28px;
    height: 28px;
  }
</style>
</head>
<body>

  <h1>🐝 Hive Tracker</h1>

  <label for="rfid">Scan Hive RFID</label>
  <input id="rfid" type="text" placeholder="Scan tag here" autofocus />

  <div id="hiveForm" class="hidden">
    <p><strong>Hive ID:</strong> <span id="hiveIdDisplay"></span></p>
    <label>Hive Name</label>
    <input id="hiveName" type="text" placeholder="e.g. Yard A – Hive 12" />
    <label>Location / Yard</label>
    <input id="location" type="text" />

    <label>Last Inspection Date</label>
    <input id="lastInspection" type="date" />

    <label>
      <input id="queenPresent" type="checkbox" />
      Queen Present
    </label>

    <label>Notes</label>
    <textarea id="notes" rows="4"></textarea>
    <h2>Inspection History</h2>
    <div id="history"></div>
  

  <script>
  const rfidInput = document.getElementById("rfid");
  const hiveForm = document.getElementById("hiveForm");
  const hiveIdDisplay = document.getElementById("hiveIdDisplay");
  const historyDiv = document.getElementById("history");
  const hiveNameInput = document.getElementById("hiveName");
if (!hiveNameInput) {
  alert("Hive name input NOT FOUND");
}
  const locationInput = document.getElementById("location");
  const lastInspectionInput = document.getElementById("lastInspection");
  const queenPresentInput = document.getElementById("queenPresent");
  const notesInput = document.getElementById("notes");
const scanButton = document.getElementById("scanNfc");

scanButton.addEventListener("click", async () => {
  if (!("NDEFReader" in window)) {
    alert("NFC not supported on this device or browser.");
    return;
  }

  try {
    const reader = new NDEFReader();
    await reader.scan();
    alert("Tap NFC tag on hive");

    reader.onreading = event => {
      const tagId = event.serialNumber;

      if (!tagId) {
        alert("Could not read tag ID");
        return;
      }

      handleHiveScan(tagId);
    };
  } catch (err) {
    alert("NFC scan failed: " + err.message);
  }
});
  let currentHiveId = null;
  let currentInspectionIndex = null;

  function today() {
    return new Date().toISOString().split("T")[0];
  }
function focusHiveNameIfNew(hive) {
  if (!hive.name) {
    setTimeout(() => hiveNameInput.focus(), 150);
  }
}
  function loadHives() {
    return JSON.parse(localStorage.getItem("hives") || "{}");
  }

  function saveHives(hives) {
    localStorage.setItem("hives", JSON.stringify(hives));
  }


  function loadHive(id) {
    const hives = loadHives();

    if (!hives[id]) {
      hives[id] = {
  id,
  name: "",
  location: "",
  inspections: []
};
      saveHives(hives);
    }

    return hives[id];
  }

  function startInspectionIfNeeded(hive) {
  const todayDate = today();

  if (
    hive.inspections.length === 0 ||
    hive.inspections[0].date !== todayDate
  ) {
    hive.inspections.unshift({
      date: todayDate,
      queenPresent: false,
      notes: ""
    });
  }

  currentInspectionIndex = 0;
}

  function saveCurrentHive() {
  if (!currentHiveId) return;

  const hives = loadHives();
  const hive = hives[currentHiveId];

  // 🔒 Ensure inspection exists
  if (
    currentInspectionIndex === null ||
    !hive.inspections[currentInspectionIndex]
  ) {
    return;
  }

  const inspection = hive.inspections[currentInspectionIndex];

  hive.name = hiveNameInput.value;
  hive.location = locationInput.value;

  inspection.date = lastInspectionInput.value;
  inspection.queenPresent = queenPresentInput.checked;
  inspection.notes = notesInput.value;

  saveHives(hives);
  renderHistory(hive);
}

  function renderHistory(hive) {
    historyDiv.innerHTML = "";

    hive.inspections.forEach((insp, index) => {
      const div = document.createElement("div");
      div.style.borderBottom = "1px solid #ccc";
      div.style.padding = "0.5rem 0";

      div.innerHTML = `
       <strong>${hive.name || hive.id}</strong><br>
<em>${insp.date}</em><br>
        Queen present: ${insp.queenPresent ? "Yes" : "No"}<br>
        ${insp.notes || ""}
      `;

      div.onclick = () => loadInspection(hive, index);
      historyDiv.appendChild(div);
    });
  }

  function loadInspection(hive, index) {
    const insp = hive.inspections[index];
    currentInspectionIndex = index;

    lastInspectionInput.value = insp.date;
    queenPresentInput.checked = insp.queenPresent;
    notesInput.value = insp.notes;
  }

 function handleHiveScan(tagId) {
  saveCurrentHive();

  currentHiveId = tagId;

  const hives = loadHives();
  const hive = loadHive(currentHiveId);

  hiveIdDisplay.textContent = currentHiveId;
  hiveNameInput.value = hive.name || "";
  locationInput.value = hive.location || "";

  startInspectionIfNeeded(hive);
  saveHives(hives);

  loadInspection(hive, 0);
  renderHistory(hive);

  hiveForm.classList.remove("hidden");

  if (!hive.name) {
    setTimeout(() => hiveNameInput.focus(), 150);
  }
}
 
  document
    .querySelectorAll("#hiveForm input, #hiveForm textarea")
    .forEach(el => el.addEventListener("input", saveCurrentHive));


</script>

</body>
</html>
