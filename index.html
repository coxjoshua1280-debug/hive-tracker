<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive Tracker</title>
 <style>
  body {
    font-family: Arial, sans-serif;
    padding: 1rem;
    background: #f8f8f8;
    font-size: 18px;
  }

  h1 {
    font-size: 1.6rem;
  }


  textarea {
    min-height: 120px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-bottom: 0.25rem;
  }

  #rfid {
    font-size: 1.2rem;
    border: 3px solid #222;
  }

  .hidden {
    display: none;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.1rem;
  }

  input[type="checkbox"] {
    width: 28px;
    height: 28px;
  }
</style>
</head>
<body>

  <h1>🐝 Hive Tracker</h1>
<button id="scanNfc" style="font-size: 1.2rem; padding: 0.75rem; width: 100%;">
  Scan Hive (NFC)
</button>
  <label for="rfid">Scan Hive RFID</label>
  <input id="rfid" type="text" placeholder="Scan tag here" autofocus />
<div id="status"></div>
  <div id="hiveForm" class="hidden">
    <p><strong>Hive ID:</strong> <span id="hiveIdDisplay"></span></p>
    <label>Hive Name</label>
    <input id="hiveName" type="text" placeholder="e.g. Yard A – Hive 12" />
    <label>Location / Yard</label>
    <input id="location" type="text" />

    <label>Last Inspection Date</label>
    <input id="lastInspection" type="date" />

    <label>
      <input id="queenPresent" type="checkbox" />
      Queen Present
    </label>

    <label>Notes</label>
    <textarea id="notes" rows="4"></textarea>
    <h2>Inspection History</h2>
    <div id="history"></div>
  

 <script>
document.addEventListener("DOMContentLoaded", () => {
  let currentHiveId = null;
  const scanButton = document.getElementById("scanNfc");
  if (!scanButton) {
    alert("Scan button NOT found");
    return;
  }
  function saveCurrentHive() {
  if (!currentHiveId) return;

  const hives = JSON.parse(localStorage.getItem("hives") || "{}");
  if (!hives[currentHiveId]) return;

  hives[currentHiveId].name =
    document.getElementById("hiveName").value;

  hives[currentHiveId].location =
    document.getElementById("location").value;

  localStorage.setItem("hives", JSON.stringify(hives));
}

  const hiveNameInput = document.getElementById("hiveName");
const locationInput = document.getElementById("location");
document.getElementById("status").textContent =
  "Hive loaded: " + (hives[tagId].name || tagId);
hiveNameInput.addEventListener("input", saveCurrentHive);
locationInput.addEventListener("input", saveCurrentHive);
  scanButton.addEventListener("click", async () => {
    
    if (!("NDEFReader" in window)) {
      alert("Web NFC not supported");
      return;
    }

    try {
      const reader = new NDEFReader();
      
      await reader.scan();
     
      reader.onreading = event => {
        const tagId = event.serialNumber;
        if (!tagId) {
          alert("Tag read but no serial number");
          return;
        }

        handleHiveScan(tagId);
      };

    } catch (err) {
      alert("NFC error: " + err.message);
    }
    function today() {
  return new Date().toISOString().split("T")[0];
}

function getOrCreateTodayInspection(hive) {
  const todayDate = today();

  const existing = hive.inspections.find(
    insp => insp.date === todayDate
  );

  if (existing) return existing;

  const inspection = {
    date: todayDate,
    queenPresent: false,
    notes: ""
  };

  hive.inspections.unshift(inspection);
  return inspection;
}
    const dateInput = document.getElementById("lastInspection");
const queenInput = document.getElementById("queenPresent");
const notesInput = document.getElementById("notes");

function saveCurrentInspection() {
  if (!currentHiveId) return;

  const hives = JSON.parse(localStorage.getItem("hives") || "{}");
  const hive = hives[currentHiveId];
  if (!hive) return;

  const inspection = hive.inspections.find(
    insp => insp.date === dateInput.value
  );
  if (!inspection) return;

  inspection.date = dateInput.value;
  inspection.queenPresent = queenInput.checked;
  inspection.notes = notesInput.value;

  localStorage.setItem("hives", JSON.stringify(hives));
}

dateInput.addEventListener("change", saveCurrentInspection);
queenInput.addEventListener("change", saveCurrentInspection);
notesInput.addEventListener("input", saveCurrentInspection);
  });

  function handleHiveScan(tagId) {

    const hives = JSON.parse(localStorage.getItem("hives") || "{}");
currentHiveId = tagId;
    if (!hives[tagId]) {
      hives[tagId] = {
        id: tagId,
        name: "",
        location: "",
        inspections: []
      };

      document
  .querySelectorAll("#hiveForm input")
  .forEach(el =>
    el.addEventListener("input", () => saveCurrentHive(currentHiveId))
  );

      function saveCurrentHive(tagId) {
        alert("Saving hive: " + tagId);
  if (!tagId) return;

  const hives = JSON.parse(localStorage.getItem("hives") || "{}");
  if (!hives[tagId]) return;

  hives[tagId].name = document.getElementById("hiveName").value;
  hives[tagId].location = document.getElementById("location").value;

  localStorage.setItem("hives", JSON.stringify(hives));
}
    }

    localStorage.setItem("hives", JSON.stringify(hives));

    // Show hive in UI
document.getElementById("hiveIdDisplay").textContent = tagId;
document.getElementById("hiveName").value = hives[tagId].name || "";
document.getElementById("location").value = hives[tagId].location || "";

// Reveal form
document.getElementById("hiveForm").classList.remove("hidden");

// Auto-focus name ONLY if new hive
if (!hives[tagId].name) {
  setTimeout(() => {
    document.getElementById("hiveName").focus();
  }, 150);
}
  }
  const hive = hives[tagId];

// 🔍 Get today’s inspection
const inspection = getOrCreateTodayInspection(hive);

// Save immediately
localStorage.setItem("hives", JSON.stringify(hives));

// Populate inspection form
document.getElementById("lastInspection").value = inspection.date;
document.getElementById("queenPresent").checked = inspection.queenPresent;
document.getElementById("notes").value = inspection.notes;
});
   // 🔒 Inspection wiring lock — prevents script crash
(function () {
  const dateInput = document.getElementById("lastInspection");
  const queenInput = document.getElementById("queenPresent");
  const notesInput = document.getElementById("notes");

  if (!dateInput || !queenInput || !notesInput) return;

  function saveCurrentInspection() {
    if (!window.currentHiveId) return;

    const hives = JSON.parse(localStorage.getItem("hives") || "{}");
    const hive = hives[window.currentHiveId];
    if (!hive || !hive.inspections) return;

    const inspection = hive.inspections.find(
      insp => insp.date === dateInput.value
    );
    if (!inspection) return;

    inspection.date = dateInput.value;
    inspection.queenPresent = queenInput.checked;
    inspection.notes = notesInput.value;

    localStorage.setItem("hives", JSON.stringify(hives));
  }

  dateInput.addEventListener("change", saveCurrentInspection);
  queenInput.addEventListener("change", saveCurrentInspection);
  notesInput.addEventListener("input", saveCurrentInspection);
})();
</script>
</body>

</html>
