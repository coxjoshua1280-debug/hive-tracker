<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 1rem;
      background: #f8f8f8;
      font-size: 18px;
    }
    h1 { font-size: 1.6rem; margin-top: 0; }
    label { font-weight: bold; display: block; margin: 0.75rem 0 0.25rem; }
    input, textarea, button { font-size: 1.05rem; width: 100%; box-sizing: border-box; }
    textarea { min-height: 120px; }
    .hidden { display: none; }
    .checkbox-label { display: flex; align-items: center; gap: 0.75rem; font-size: 1.1rem; margin-top: 0.75rem; }
    input[type="checkbox"] { width: 28px; height: 28px; }
    #status { margin: 0.75rem 0 1rem; }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 0.75rem;
      margin: 0.5rem 0;
    }
    .row {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .row > .grow { flex: 1; }
    .small { font-size: 0.9rem; opacity: 0.85; }
    .btn {
      font-size: 1.1rem;
      padding: 0.75rem;
      border: 1px solid #222;
      border-radius: 10px;
      background: #fff;
    }
    .btn-primary {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .btn-danger {
      background: #fff;
      border-color: #b00;
      color: #b00;
    }
    .btn-muted {
      background: #f6f6f6;
      border-color: #999;
      color: #222;
    }
    .history-item {
      padding: 0.6rem;
      border-bottom: 1px solid #eee;
      display: flex;
      gap: 0.75rem;
      justify-content: space-between;
      align-items: center;
    }
    .history-item:last-child { border-bottom: none; }
    .history-left { flex: 1; cursor: pointer; }
    .selected { background: #eef; border-radius: 8px; }
    a { color: #0645AD; }
    .badge {
      display: inline-block;
      padding: 0.12rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-right: 0.3rem;
      background: #fafafa;
    }
    .badge.on {
      border-color: #111;
      background: #111;
      color: #fff;
    }
    .flag-row { margin-top: 0.5rem; }
    .flag-btn {
      width: auto;
      padding: 0.5rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #444;
      background: #fff;
      margin: 0.2rem 0.2rem 0.2rem 0;
      font-size: 1rem;
    }
    .flag-btn.on {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    /* Photo gallery */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #f2f2f2;
    }
    .thumb-wrap {
      position: relative;
    }
    .thumb-del {
      position: absolute;
      top: 6px;
      right: 6px;
      width: auto;
      padding: 0.25rem 0.4rem;
      border-radius: 10px;
      border: 1px solid #b00;
      background: rgba(255,255,255,0.9);
      color: #b00;
      font-size: 0.9rem;
    }

    /* Simple viewer modal */
    #viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
    }
    #viewer img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #viewerClose {
      position: fixed;
      top: 12px;
      right: 12px;
      width: auto;
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      border: 1px solid #fff;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <h1>🐝 Hive Tracker</h1>

  <button id="scanNfc" class="btn btn-primary">Scan Hive (NFC)</button>

  <label for="currentYard">Current Yard</label>
  <input id="currentYard" type="text" placeholder="e.g. Yard A" list="yardList" />
  <datalist id="yardList"></datalist>

  <div class="row" style="margin-top:0.5rem;">
    <button id="captureYardGps" type="button" class="btn">📍 Capture Yard GPS</button>
    <button id="detectNearestYard" type="button" class="btn">🧭 Detect Nearest Yard</button>
  </div>

  <div id="yardGps" class="small" style="margin-top:0.5rem;"></div>

 <div class="row" style="margin-top:0.75rem;">
  <button id="exportCsv" type="button" class="btn grow">⬇️ Export CSV</button>
  <button id="exportZip" type="button" class="btn btn-muted grow">⬇️ Export Backup ZIP</button>
  <button id="importZipBtn" type="button" class="btn grow">⬆️ Import Backup ZIP</button>
</div>

<input id="importZipInput" type="file" accept=".zip,application/zip" class="hidden" />



  <div id="yardHives" class="card"></div>
  <div id="status" class="small"></div>

  <div id="hiveForm" class="hidden card">
    <p style="margin-top:0;"><strong>Hive ID:</strong> <span id="hiveIdDisplay"></span></p>

    <label for="hiveName">Hive Name</label>
    <input id="hiveName" type="text" placeholder="e.g. Yard A – Hive 12" />

    <label for="location">Location / Yard</label>
    <input id="location" type="text" placeholder="e.g. Yard A" />
    <div id="hiveYardGps" class="small" style="margin-top:0.4rem;"></div>

    <button id="newInspectionBtn" type="button" class="btn">New Inspection</button>

    <label for="lastInspection">Inspection Date</label>
    <input id="lastInspection" type="date" />

    <div class="card" style="margin-top:0.75rem;">
      <strong>Quick Flags</strong>
      <div class="small">Tap to toggle. These are saved on this inspection.</div>
      <div id="flagButtons" class="flag-row"></div>
    </div>

    <label class="checkbox-label">
      <input id="queenPresent" type="checkbox" />
      Queen Present
    </label>

    <label for="notes">Notes</label>
    <textarea id="notes" rows="4" placeholder="What did you see?"></textarea>

    <div class="card" style="margin-top:0.75rem;">
      <strong>Photos</strong>
      <div class="small">Saved offline on this device (IndexedDB). Use JSON export to back up data.</div>
      <div class="row" style="margin-top:0.5rem;">
        <button id="addPhotoBtn" type="button" class="btn">📷 Add Photo</button>
      </div>
      <input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden" />
      <div id="photoGallery" class="gallery"></div>
    </div>

    <h2 style="margin: 1rem 0 0.5rem;">Inspection History</h2>
    <div id="history" class="card" style="margin:0;"></div>
  </div>

  <div id="viewer">
    <button id="viewerClose" type="button">Close</button>
    <img id="viewerImg" alt="Photo" />
  </div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    // =========================================================
    //  Light modularization (same file): Utils / Storage / Photos / UI / NFC / GPS
    // =========================================================

    // ---------------- Utils ----------------
    const Utils = {
      today() { return new Date().toISOString().split("T")[0]; },
      uuid() {
        return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2));
      },
      toRad(deg) { return deg * Math.PI / 180; },
      distanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = this.toRad(lat2 - lat1);
        const dLon = this.toRad(lon2 - lon1);
        const a =
          Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) *
          Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
      },
      mapsLink(lat, lon) {
        const q = `${lat},${lon}`;
        return `https://www.google.com/maps?q=${encodeURIComponent(q)}`;
      },
      csvEscape(v) {
        const s = (v ?? "").toString();
        if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
        return s;
      },
      async compressImageFileToJpegBlob(file, maxDim = 1600, quality = 0.72) {
        // Reads file -> draws to canvas -> exports JPEG blob
        const dataUrl = await new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.onerror = reject;
          r.readAsDataURL(file);
        });

        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = dataUrl;
        });

        const w = img.naturalWidth || img.width;
        const h = img.naturalHeight || img.height;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        const cw = Math.max(1, Math.round(w * scale));
        const ch = Math.max(1, Math.round(h * scale));

        const canvas = document.createElement("canvas");
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);

        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
        if (!blob) throw new Error("Could not compress image.");
        return blob;
      }
    };

    // ---------------- Storage ----------------
    const Storage = {
      VERSION: 2, // bump as features grow

      load(key, fallback) {
        try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
        catch { return fallback; }
      },
      save(key, value) {
        // Guardrail: quota-safe save
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return { ok: true };
        } catch (e) {
          return { ok: false, error: e };
        }
      },

      loadHives() { return this.load("hives", {}); },
      saveHives(hives) { return this.save("hives", hives); },

      // yards: { "Yard A": { lat, lon, accuracy, timestamp } }
      loadYards() { return this.load("yards", {}); },
      saveYards(yards) { return this.save("yards", yards); },

      // meta holds app version for migrations
      loadMeta() { return this.load("meta", { version: 1 }); },
      saveMeta(meta) { return this.save("meta", meta); },

      migrateIfNeeded() {
        const meta = this.loadMeta();
        const from = meta.version || 1;
        if (from >= this.VERSION) return;

        // Migration: add flags/photos arrays to inspections
        const hives = this.loadHives();
        for (const hive of Object.values(hives)) {
          if (!Array.isArray(hive.inspections)) hive.inspections = [];
          hive.inspections.forEach(insp => {
            if (!insp.flags) {
              insp.flags = { strong:false, weak:false, queenless:false, followUp:false, fed:false };
            } else {
              // ensure keys exist
              insp.flags.strong = !!insp.flags.strong;
              insp.flags.weak = !!insp.flags.weak;
              insp.flags.queenless = !!insp.flags.queenless;
              insp.flags.followUp = !!insp.flags.followUp;
              insp.flags.fed = !!insp.flags.fed;
            }
            if (!Array.isArray(insp.photos)) insp.photos = []; // stores photoIds
          });
        }

        this.saveHives(hives);
        meta.version = this.VERSION;
        this.saveMeta(meta);
      },

      createInspection(hive, date) {
        const insp = {
          id: Utils.uuid(),
          date: date || Utils.today(),
          queenPresent: false,
          notes: "",
          flags: { strong:false, weak:false, queenless:false, followUp:false, fed:false },
          photos: []
        };
        hive.inspections.unshift(insp);
        return insp;
      },

      getOrCreateTodayInspection(hive) {
        const t = Utils.today();
        return hive.inspections.find(i => i.date === t) || this.createInspection(hive, t);
      }
    };

    // ---------------- Photos (IndexedDB) ----------------
    const Photos = {
      db: null,
      DB_NAME: "hive-tracker",
      STORE: "photos",

      async open() {
        if (this.db) return this.db;
        this.db = await new Promise((resolve, reject) => {
          const req = indexedDB.open(this.DB_NAME, 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains(this.STORE)) {
              db.createObjectStore(this.STORE, { keyPath: "id" });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error || new Error("IndexedDB open failed"));
        });
        return this.db;
      },

      async putBlob(blob) {
        const id = Utils.uuid();
        const db = await this.open();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(this.STORE, "readwrite");
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error("Photo save failed"));
          tx.objectStore(this.STORE).put({ id, blob, createdAt: Date.now() });
        });
        return id;
      },

      async putBlobWithId(id, blob) {
  const db = await this.open();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(this.STORE, "readwrite");
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error("Photo restore failed"));
    tx.objectStore(this.STORE).put({ id, blob, createdAt: Date.now() });
  });
  return id;
},


      async getBlob(id) {
        const db = await this.open();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(this.STORE, "readonly");
          const req = tx.objectStore(this.STORE).get(id);
          req.onsuccess = () => resolve(req.result ? req.result.blob : null);
          req.onerror = () => reject(req.error || new Error("Photo read failed"));
        });
      },

      async delete(id) {
        const db = await this.open();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(this.STORE, "readwrite");
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error || new Error("Photo delete failed"));
          tx.objectStore(this.STORE).delete(id);
        });
      },

      async deleteMany(ids) {
        for (const id of (ids || [])) {
          try { await this.delete(id); } catch (_) {}
        }
      }
    };

    // ---------------- State ----------------
    const State = {
      currentHiveId: null,
      currentInspectionId: null,
      // NFC lifecycle
      scanning: false,
      activeReader: null,
      scanSession: 0,
      // GPS
      lastPosition: null
    };

    // ---------------- Elements ----------------
    const el = {
  btnScan: document.getElementById("scanNfc"),
  status: document.getElementById("status"),
  hiveForm: document.getElementById("hiveForm"),

  hiveIdDisplay: document.getElementById("hiveIdDisplay"),
  hiveName: document.getElementById("hiveName"),
  location: document.getElementById("location"),
  date: document.getElementById("lastInspection"),
  queen: document.getElementById("queenPresent"),
  notes: document.getElementById("notes"),
  history: document.getElementById("history"),

  currentYard: document.getElementById("currentYard"),
  yardList: document.getElementById("yardList"),
  yardHives: document.getElementById("yardHives"),

  newInspectionBtn: document.getElementById("newInspectionBtn"),
  captureYardGps: document.getElementById("captureYardGps"),
  detectNearestYard: document.getElementById("detectNearestYard"),
  yardGps: document.getElementById("yardGps"),

  exportCsv: document.getElementById("exportCsv"),
  exportZip: document.getElementById("exportZip"),
  importZipBtn: document.getElementById("importZipBtn"),
  importZipInput: document.getElementById("importZipInput"),

  hiveYardGps: document.getElementById("hiveYardGps"),

  flagButtons: document.getElementById("flagButtons"),

  addPhotoBtn: document.getElementById("addPhotoBtn"),
  photoInput: document.getElementById("photoInput"),
  photoGallery: document.getElementById("photoGallery"),

  viewer: document.getElementById("viewer"),
  viewerImg: document.getElementById("viewerImg"),
  viewerClose: document.getElementById("viewerClose"),
};

    // Validate required elements (stability)
    for (const [k, v] of Object.entries(el)) {
      if (!v) {
        alert(`Missing required HTML element: ${k}`);
        return;
      }
    }

    // ---------------- UI helpers ----------------
    const UI = {
      status(text) { el.status.textContent = text || ""; },

      renderBadgesFromFlags(flags) {
        const order = [
          ["strong", "Strong"],
          ["weak", "Weak"],
          ["queenless", "Queenless"],
          ["followUp", "Follow-up"],
          ["fed", "Fed"]
        ];
        return order
          .filter(([key]) => !!flags?.[key])
          .map(([key, label]) => `<span class="badge on">${label}</span>`)
          .join("");
      },

      ensureInspectionDefaults(insp) {
        if (!insp.flags) insp.flags = { strong:false, weak:false, queenless:false, followUp:false, fed:false };
        if (!Array.isArray(insp.photos)) insp.photos = [];
      },

      loadInspectionIntoForm(hive, inspectionId) {
        const insp = hive.inspections.find(i => i.id === inspectionId) || hive.inspections[0];
        if (!insp) return;

        this.ensureInspectionDefaults(insp);

        State.currentInspectionId = insp.id;
        el.date.value = insp.date || Utils.today();
        el.queen.checked = !!insp.queenPresent;
        el.notes.value = insp.notes || "";
        this.status(`Loaded inspection: ${insp.date || "(no date)"}`);

        this.renderFlagButtons(hive, insp);
        this.renderHistory(hive);
        this.renderPhotoGallery(hive, insp).catch(() => {});
      },

      renderHistory(hive) {
        el.history.innerHTML = "";

        if (!hive.inspections || hive.inspections.length === 0) {
          el.history.innerHTML = "<em>No inspections yet.</em>";
          return;
        }

        hive.inspections.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

        hive.inspections.forEach((insp) => {
          this.ensureInspectionDefaults(insp);

          const row = document.createElement("div");
          row.className = "history-item" + (insp.id === State.currentInspectionId ? " selected" : "");

          const left = document.createElement("div");
          left.className = "history-left";

          const queenText = insp.queenPresent ? "Queen: Yes" : "Queen: No";
          const notesPreview = (insp.notes || "").trim().slice(0, 60);
          const badges = this.renderBadgesFromFlags(insp.flags);
          const photoCount = (insp.photos?.length || 0);

          left.innerHTML = `
            <div><strong>${insp.date || "(no date)"}</strong></div>
            <div class="small">
              ${queenText}
              ${badges ? " • " + badges : ""}
              ${photoCount ? ` • 📷 ${photoCount}` : ""}
              ${notesPreview ? " • " + notesPreview : ""}
            </div>
          `;

          left.addEventListener("click", () => {
            this.loadInspectionIntoForm(hive, insp.id);
          });

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "btn btn-danger";
          delBtn.style.width = "auto";
          delBtn.style.padding = "0.4rem 0.6rem";
          delBtn.textContent = "Delete";

          delBtn.addEventListener("click", async () => {
            if (!confirm("Delete this inspection? (Photos attached to it will also be deleted.)")) return;

            // delete photos in IDB first
            try { await Photos.deleteMany(insp.photos || []); } catch (_) {}

            hive.inspections = hive.inspections.filter(i => i.id !== insp.id);

            if (State.currentInspectionId === insp.id) {
              State.currentInspectionId = hive.inspections[0]?.id || null;
              if (State.currentInspectionId) this.loadInspectionIntoForm(hive, State.currentInspectionId);
              else {
                // cleared form fields
                el.date.value = Utils.today();
                el.queen.checked = false;
                el.notes.value = "";
                el.flagButtons.innerHTML = "";
                el.photoGallery.innerHTML = "";
              }
            }

            const hives = Storage.loadHives();
            hives[hive.id] = hive;
            const res = Storage.saveHives(hives);
            if (!res.ok) this.status("Save failed (storage full?) — export JSON backup!");

            this.renderHistory(hive);
            this.status("Inspection deleted");
          });

          row.appendChild(left);
          row.appendChild(delBtn);
          el.history.appendChild(row);
        });
      },

      refreshYardUI() {
        const hives = Storage.loadHives();

        const yardsSet = new Set();
        Object.values(hives).forEach(h => { if (h.location) yardsSet.add(h.location); });

        el.yardList.innerHTML = "";
        [...yardsSet].sort().forEach(y => {
          const opt = document.createElement("option");
          opt.value = y;
          el.yardList.appendChild(opt);
        });

        const selected = (el.currentYard.value || "").trim();
        if (!selected) {
          el.yardHives.innerHTML = "<em>Enter a yard name to list its hives.</em>";
          return;
        }

        const yardHives = Object.values(hives)
          .filter(h => (h.location || "").trim() === selected)
          .sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));

        if (yardHives.length === 0) {
          el.yardHives.innerHTML = `<em>No hives saved in "${selected}".</em>`;
          return;
        }

        el.yardHives.innerHTML = `<strong>Hives in ${selected}:</strong><div id="yardHiveButtons" style="margin-top:0.5rem;"></div>`;
        const container = document.getElementById("yardHiveButtons");

        yardHives.forEach(h => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "btn";
          b.style.margin = "0.25rem 0";
          b.textContent = h.name ? `${h.name}` : h.id;
          b.addEventListener("click", () => App.handleHiveLoad(h.id));
          container.appendChild(b);
        });
      },

      renderYardGps(yardName) {
        if (!yardName) { el.yardGps.textContent = ""; return; }

        const y = Storage.loadYards()[yardName];
        if (!y) {
          el.yardGps.innerHTML = `<em>No GPS saved for "${yardName}".</em>`;
          return;
        }

        let distText = "";
        if (State.lastPosition) {
          const d = Utils.distanceMeters(
            State.lastPosition.coords.latitude,
            State.lastPosition.coords.longitude,
            y.lat, y.lon
          );
          distText = ` • Distance: ${Math.round(d)} m`;
        }

        el.yardGps.innerHTML =
          `GPS: ${y.lat.toFixed(5)}, ${y.lon.toFixed(5)} (±${Math.round(y.accuracy)}m)` +
          `${distText} • <a href="${Utils.mapsLink(y.lat, y.lon)}" target="_blank" rel="noopener">Open in Maps</a>`;
      },

      renderHiveYardGps() {
        const yardName = (el.location.value || "").trim();
        if (!yardName) { el.hiveYardGps.textContent = ""; return; }

        const y = Storage.loadYards()[yardName];
        if (!y) {
          el.hiveYardGps.innerHTML = `<em>No GPS saved for "${yardName}".</em>`;
          return;
        }

        let distText = "";
        if (State.lastPosition) {
          const d = Utils.distanceMeters(
            State.lastPosition.coords.latitude,
            State.lastPosition.coords.longitude,
            y.lat, y.lon
          );

    // ---------------- GPS ----------------
    const GPS = {
      getCurrentPositionOnce() {
        return new Promise((resolve, reject) => {

          navigator.geolocation.getCurrentPosition(
            (pos) => resolve(pos),
            (err) => reject(err),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
          );
        });
      },

      findNearestYard(radiusMeters = 100) {
        if (!State.lastPosition) return null;
        const yards = Storage.loadYards();
        const lat = State.lastPosition.coords.latitude;
        const lon = State.lastPosition.coords.longitude;

        let best = null;
        for (const [name, y] of Object.entries(yards)) {
          if (!y || typeof y.lat !== "number" || typeof y.lon !== "number") continue;
          const d = Utils.distanceMeters(lat, lon, y.lat, y.lon);
          if (d <= radiusMeters && (!best || d < best.meters)) best = { name, meters: d };
        }
        return best;
      }
    };

    // ---------------- NFC ----------------
    const NFC = {
      stopScan() {
        State.scanning = false;
        State.scanSession++;
        if (State.activeReader) {
          try { State.activeReader.onreading = null; } catch (_) {}
          try { State.activeReader.onreadingerror = null; } catch (_) {}
          try { State.activeReader.abort(); } catch (_) {}
        }
        State.activeReader = null;
        UI.status("Ready");
      },

      async startScan() {
        if (State.scanning) return;
        this.stopScan();
        State.scanning = true;
        const mySession = State.scanSession;

        if (!("NDEFReader" in window)) {
          alert("Web NFC not supported on this device/browser.");
          State.scanning = false;
          return;
        }

        // Optional: detect nearest yard if blank
        if (!(el.currentYard.value || "").trim()) {
          try {
            const pos = await GPS.getCurrentPositionOnce();
            State.lastPosition = pos;

              el.currentYard.value = nearest.name;
              UI.refreshYardUI();
              UI.renderYardGps(nearest.name);
            }
          } catch (_) {}
        }

        try {
          const reader = new NDEFReader();
          State.activeReader = reader;

          UI.status("Scanning… tap hive tag");
          await reader.scan();

          reader.onreadingerror = () => {
            if (mySession !== State.scanSession) return;

              this.stopScan();

function normalizeHive(h) {
  if (!h || typeof h !== "object") return { id: "", name: "", location: "", inspections: [] };
  if (!Array.isArray(h.inspections)) h.inspections = [];
  return h;
}

function normalizeInspection(i) {
  if (!i || typeof i !== "object") {
    return {
      id: Utils.uuid(),
      date: Utils.today(),
      queenPresent: false,
      notes: "",
      flags: { strong:false, weak:false, queenless:false, followUp:false, fed:false },
      photos: []
    };
  }
  if (!i.id) i.id = Utils.uuid();
  if (!i.date) i.date = Utils.today();
  if (!i.flags) i.flags = { strong:false, weak:false, queenless:false, followUp:false, fed:false };
  if (!Array.isArray(i.photos)) i.photos = [];
  return i;
}

function mergeYards(existing, incoming) {
  const out = { ...(existing || {}) };
  for (const [name, y] of Object.entries(incoming || {})) {
    if (!out[name]) {
      out[name] = y;
      continue;
    }
    // Fill GPS only if existing yard doesn't have valid coords
    const ex = out[name];
    const exHasGps = ex && typeof ex.lat === "number" && typeof ex.lon === "number";
    const inHasGps = y && typeof y.lat === "number" && typeof y.lon === "number";
    if (!exHasGps && inHasGps) out[name] = y;
  }
  return out;
}

function mergeHives(existing, incoming) {
  const out = { ...(existing || {}) };

  for (const [hiveId, inHiveRaw] of Object.entries(incoming || {})) {
    const inHive = normalizeHive({ ...inHiveRaw, id: hiveId });

    // normalize inspections in incoming
    inHive.inspections = (inHive.inspections || []).map(i => normalizeInspection({ ...i }));

    if (!out[hiveId]) {
      out[hiveId] = inHive;
      continue;
    }

    const exHive = normalizeHive(out[hiveId]);

    // Fill blanks only (keep existing if already set)
    if (!((exHive.name || "").trim()) && (inHive.name || "").trim()) exHive.name = inHive.name;
    if (!((exHive.location || "").trim()) && (inHive.location || "").trim()) exHive.location = inHive.location;

    // Merge inspections by id
    const exById = new Map((exHive.inspections || []).map(i => [i.id, normalizeInspection(i)]));
    for (const insp of (inHive.inspections || [])) {
      if (!exById.has(insp.id)) {
        exHive.inspections.push(insp);
        exById.set(insp.id, insp);
      }
      // If collision: skip imported (safer than duplicating)
    }

    // Keep newest-first order
    exHive.inspections.sort((a, b) => (b.date || "").localeCompare(a.date || ""));

    out[hiveId] = exHive;
  }

  return out;
}

async function restorePhotosFromZip(zip, UI) {
  const photoFiles = Object.values(zip.files).filter(f =>
    !f.dir &&
    f.name.startsWith("photos/") &&
    (f.name.toLowerCase().endsWith(".jpg") || f.name.toLowerCase().endsWith(".jpeg"))
  );

  let restored = 0;
  for (const f of photoFiles) {
    const name = f.name.split("/").pop();         // "<id>.jpg"
    const id = (name || "").replace(/\.(jpe?g)$/i, "");
    if (!id) continue;

    const blob = await f.async("blob");
    await Photos.putBlobWithId(id, blob);

    restored++;
    if (restored % 10 === 0) UI.status(`Restoring photos… (${restored}/${photoFiles.length})`);
  }
  return restored;
}

el.importZipInput.addEventListener("change", async () => {
  const file = el.importZipInput.files && el.importZipInput.files[0];
  if (!file) return;

  try {
    if (!window.JSZip) {
      alert("ZIP import needs JSZip. Open this page once while online so the library can load, then try again.");
      return;
    }

    // Choose mode
    const overwrite = confirm(
      "Import mode:\n\n" +
      "OK = OVERWRITE this device (replace all hives/yards)\n" +
      "Cancel = MERGE (keep existing, add missing, fill blanks)\n\n" +
      "Tip: Export a ZIP first if you want a safety copy."
    );

    UI.status("Reading ZIP…");
    const zip = await JSZip.loadAsync(file);

    // --- Find backup JSON ---
    let jsonFile =
      zip.file("hive-tracker-backup.json") ||
      zip.file("backup.json") ||
      zip.file("hive-tracker.json");

    if (!jsonFile) {
      const anyJson = Object.values(zip.files).find(f => !f.dir && f.name.toLowerCase().endsWith(".json"));
      if (anyJson) jsonFile = zip.file(anyJson.name);
    }
    if (!jsonFile) throw new Error("No JSON file found in ZIP.");

    const jsonText = await jsonFile.async("string");
    const payload = JSON.parse(jsonText);

    if (!payload || payload.app !== "hive-tracker") {
      throw new Error("This ZIP doesn't look like a Hive Tracker backup.");
    }

    const inYards = payload.yards || {};
    const inHives = payload.hives || {};
    const inMeta  = payload.meta  || { version: 1 };

    if (overwrite) {
      // --- OVERWRITE localStorage ---
      UI.status("Overwriting data…");

            let res = Storage.save("yards", inYards);
      if (!res.ok) throw new Error("Failed to save yards (storage full?).");

      res = Storage.save("hives", inHives);
      if (!res.ok) throw new Error("Failed to save hives (storage full?).");

      res = Storage.save("meta", inMeta);
      if (!res.ok) throw new Error("Failed to save meta (storage full?).");

    } else {
      // --- MERGE with existing ---
      UI.status("Merging data…");

      const exYards = Storage.loadYards();
      const exHives = Storage.loadHives();
      const exMeta  = Storage.loadMeta();

      const mergedYards = mergeYards(exYards, inYards);
      const mergedHives = mergeHives(exHives, inHives);

      const mergedMeta = {
        ...(exMeta || {}),
        ...(inMeta || {}),
        // keep the highest version number we see
        version: Math.max(exMeta?.version || 1, inMeta?.version || 1, Storage.VERSION)
      };

      let res = Storage.save("yards", mergedYards);
      if (!res.ok) throw new Error("Failed to save merged yards (storage full?).");

      res = Storage.save("hives", mergedHives);
      if (!res.ok) throw new Error("Failed to save merged hives (storage full?).");

      res = Storage.save("meta", mergedMeta);
      if (!res.ok) throw new Error("Failed to save merged meta (storage full?).");
    }

    // Ensure new fields exist
    Storage.migrateIfNeeded();

    // --- Restore photos (works for both modes) ---
    UI.status("Restoring photos…");
    const restored = await restorePhotosFromZip(zip, UI);

    resetUiAfterImport(UI);

    UI.status(`Import complete ✅ (${overwrite ? "overwrite" : "merge"}; photos restored: ${restored})`);
    alert(`Import complete!\n\nMode: ${overwrite ? "Overwrite" : "Merge"}\nPhotos restored: ${restored}\n\nPick a yard/hive to continue.`);
  } catch (err) {
    alert("ZIP import error: " + (err?.message || err));
    UI.status("Ready");
  }
});





    // NFC button
    el.btnScan.addEventListener("click", async () => {
      await NFC.startScan();
    });

    // Initial UI
    UI.status("Ready");
    UI.refreshYardUI();
    UI.renderYardGps((el.currentYard.value || "").trim());
    UI.renderHiveYardGps();
  });
  </script>
</body>
</html>
