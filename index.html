<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hive Tracker</title>
 <style>
  body {
    font-family: Arial, sans-serif;
    padding: 1rem;
    background: #f8f8f8;
    font-size: 18px;
  }

  h1 {
    font-size: 1.6rem;
  }


  textarea {
    min-height: 120px;
  }

  label {
    font-weight: bold;
    display: block;
    margin-bottom: 0.25rem;
  }

  #rfid {
    font-size: 1.2rem;
    border: 3px solid #222;
  }

  .hidden {
    display: none;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 1.1rem;
  }

  input[type="checkbox"] {
    width: 28px;
    height: 28px;
  }
</style>
</head>
<body>

  <h1>🐝 Hive Tracker</h1>
<button id="scanNfc" style="font-size: 1.2rem; padding: 0.75rem; width: 100%;">
  Scan Hive (NFC)
</button>
  <label for="rfid">Scan Hive RFID</label>
  <input id="rfid" type="text" placeholder="Scan tag here" autofocus />

  <div id="hiveForm" class="hidden">
    <p><strong>Hive ID:</strong> <span id="hiveIdDisplay"></span></p>
    <label>Hive Name</label>
    <input id="hiveName" type="text" placeholder="e.g. Yard A – Hive 12" />
    <label>Location / Yard</label>
    <input id="location" type="text" />

    <label>Last Inspection Date</label>
    <input id="lastInspection" type="date" />

    <label>
      <input id="queenPresent" type="checkbox" />
      Queen Present
    </label>

    <label>Notes</label>
    <textarea id="notes" rows="4"></textarea>
    <h2>Inspection History</h2>
    <div id="history"></div>
  

 <script>
document.addEventListener("DOMContentLoaded", () => {
  alert("Script loaded");

  const scanButton = document.getElementById("scanNfc");
  if (!scanButton) {
    alert("Scan button NOT found");
    return;
  }

  scanButton.addEventListener("click", async () => {
    alert("Scan button clicked");

    if (!("NDEFReader" in window)) {
      alert("Web NFC not supported on this device/browser");
      return;
    }

    try {
      const reader = new NDEFReader();
      alert("Starting NFC scan...");
      await reader.scan();
      alert("Now tap an NFC tag");

      reader.onreading = event => {
        alert("Tag read!");
        alert("Serial number: " + event.serialNumber);
      };

    } catch (err) {
      alert("NFC error: " + err.message);
    }
  });
});
</script>

</body>

</html>
